name: Build ULTRON APK
# ULTRON mobile APK build workflow
# Rebuild trigger: 2026-10-21

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare ULTRON APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ULTRON-Mobile.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-Mobile-verified
          path: ULTRON-Mobile.apk
          if-no-files-found: error
