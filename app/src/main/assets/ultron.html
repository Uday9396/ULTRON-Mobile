<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ULTRON</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{background:radial-gradient(circle at 50% 18%,#270000 0,#090909 35%,#020202 75%);color:#eee;font-family:Arial,sans-serif;overflow:hidden}button{background:#141414;color:#ff4a4a;border:1px solid #731818;border-radius:10px;font-weight:700}header{text-align:center;padding:22px 14px 12px}h1{color:#ff3838;font-size:30px;letter-spacing:8px;text-shadow:0 0 18px #f00}.online{color:#6cff82;margin-top:6px;letter-spacing:2px;font-size:10px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px}.quick button{height:48px;font-size:12px}.quick button.active{background:#421010;color:#fff}.home{height:100%;display:flex;flex-direction:column}.core-area{flex:1;display:flex;justify-content:center;align-items:center;min-height:120px}.core{width:96px;height:96px;border:2px solid #ff3030;border-radius:50%;display:flex;justify-content:center;align-items:center;box-shadow:0 0 25px #ff2020,inset 0 0 20px #ff2020;animation:pulse 1.8s infinite alternate}.core-inner{width:38px;height:38px;border-radius:50%;background:#ff2020;box-shadow:0 0 24px #f00,0 0 45px #f00}@keyframes pulse{from{transform:scale(.95);opacity:.65}to{transform:scale(1.04);opacity:1}}.composer{display:flex;gap:8px;padding:12px 14px max(14px,env(safe-area-inset-bottom))}.composer input,.settings input{flex:1;min-width:0;background:#0d0d0d;border:1px solid #641717;color:#fff;padding:13px;border-radius:10px;outline:none;font-size:16px}.composer button{padding:0 16px}.moreButton{margin:0 14px 4px;height:34px}.more{display:none;margin:0 14px 8px;padding:10px;border:1px solid #641717;border-radius:10px;background:#0a0a0a}.more.open{display:block}.settings{display:flex;gap:6px}.settings button{padding:10px}.small{font-size:10px;color:#777;margin-top:7px}.chatScreen{display:none;height:100%;flex-direction:column;background:#050505}.chatScreen.open{display:flex}.chatTop{display:flex;align-items:center;gap:12px;padding:15px;border-bottom:1px solid #451010}.back{width:42px;height:38px}.chatTitle{color:#ff4040;letter-spacing:3px;font-weight:700}.chat{flex:1;overflow-y:auto;padding:16px;line-height:1.5;font-size:14px}.chat p{margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}.ultron-name{color:#ff4040}.user-name{color:#aaa}.thinking{color:#888;font-style:italic}.error{color:#ff6262}
</style></head><body>
<section id="home" class="home">
<header><h1>ULTRON</h1><div class="online">● SYSTEM ONLINE</div></header>
<div class="quick"><button id="voiceButton" onclick="startVoice()">🎙 VOICE</button><button onclick="openCamera()">📷 CAMERA</button><button id="flashButton" onclick="toggleFlashlight()">🔦 OFF</button></div>
<div class="core-area"><div class="core"><div class="core-inner"></div></div></div>
<section id="morePanel" class="more"><div class="settings"><input id="baseUrl" placeholder="PC core address"><input id="token" type="password" placeholder="App token"><button onclick="saveConnection()">SAVE</button></div><div class="small" id="connState">PC settings stay hidden here.</div><div class="settings" style="margin-top:8px"><button id="ttsButton" onclick="toggleTts()">🔊 TTS: ON</button></div></section>
<button class="moreButton" onclick="toggleMore()">⋯ MORE</button>
<div class="composer"><input id="homeMessage" type="text" enterkeyhint="send" placeholder="Message ULTRON..." autocomplete="off"><button onclick="sendFromHome()">SEND</button></div>
</section>
<section id="chatScreen" class="chatScreen">
<div class="chatTop"><button class="back" onclick="closeChat()">←</button><div class="chatTitle">ULTRON // CHAT</div></div>
<div id="chat" class="chat"><p><strong class="ultron-name">ULTRON:</strong> Awaiting instructions.</p></div>
<div class="composer"><input id="chatMessage" type="text" enterkeyhint="send" placeholder="Message ULTRON..." autocomplete="off"><button onclick="sendFromChat()">SEND</button></div>
</section>
<script>
let waiting=false,ttsOn=true;
function addMessage(name,text,type=""){const c=document.getElementById("chat"),p=document.createElement("p"),s=document.createElement("strong");s.className=name==="ULTRON"?"ultron-name":"user-name";s.textContent=name+": ";p.appendChild(s);p.appendChild(document.createTextNode(text));if(type)p.classList.add(type);c.appendChild(p);c.scrollTop=c.scrollHeight;return p}
function openChat(){document.getElementById("home").style.display="none";document.getElementById("chatScreen").classList.add("open");setTimeout(()=>document.getElementById("chatMessage").focus(),80)}
function closeChat(){document.getElementById("chatScreen").classList.remove("open");document.getElementById("home").style.display="flex"}
function sendCore(m){m=(m||"").trim();if(!m||waiting)return;openChat();addMessage("YOU",m);waiting=true;const p=addMessage("ULTRON","Analyzing...","thinking");p.id="thinking";UltronAndroid.sendMessage(m)}
function sendFromHome(){const i=document.getElementById("homeMessage"),m=i.value;i.value="";sendCore(m)}
function sendFromChat(){const i=document.getElementById("chatMessage"),m=i.value;i.value="";sendCore(m)}
function receiveUltron(t){document.getElementById("thinking")?.remove();waiting=false;addMessage("ULTRON",t);if(ttsOn)UltronAndroid.speak(t)}
function receiveError(t){document.getElementById("thinking")?.remove();waiting=false;addMessage("ULTRON",t,"error")}
function startVoice(){UltronAndroid.startVoice()}
function openCamera(){UltronAndroid.openCamera()}
function toggleFlashlight(){UltronAndroid.toggleFlashlight()}
function flashlightState(t){const b=document.getElementById("flashButton");b.textContent="🔦 "+t;b.classList.toggle("active",t==="ON")}
function cameraState(t){if(t==="CAMERA UNAVAILABLE")alert(t)}
function voiceState(t){document.getElementById("voiceButton").textContent="🎙 "+t}
function voiceResult(t){document.getElementById("voiceButton").textContent="🎙 VOICE";if(t)sendCore(t)}
function toggleTts(){ttsOn=!ttsOn;if(!ttsOn){try{UltronAndroid.stopSpeaking()}catch(e){}}document.getElementById("ttsButton").textContent="🔊 TTS: "+(ttsOn?"ON":"OFF")}
function toggleMore(){document.getElementById("morePanel").classList.toggle("open")}
function saveConnection(){UltronAndroid.saveConnection(document.getElementById("baseUrl").value,document.getElementById("token").value)}
function connectionState(t){document.getElementById("connState").textContent="Connection settings: "+t}
["homeMessage","chatMessage"].forEach(id=>document.getElementById(id).addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();id==="homeMessage"?sendFromHome():sendFromChat()}}));
window.addEventListener("load",()=>{try{const saved=UltronAndroid.getBaseUrl();document.getElementById("baseUrl").value=saved;if(saved)document.getElementById("connState").textContent="PC connection saved: "+saved}catch(e){}});
</script></body></html>
