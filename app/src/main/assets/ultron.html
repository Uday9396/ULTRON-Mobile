<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ULTRON</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:radial-gradient(circle at center,#260000 0%,#080808 35%,#020202 75%);color:#eee;font-family:Arial,sans-serif;padding-bottom:20px}header{text-align:center;padding:24px 10px;border-bottom:1px solid #5c1111}h1{color:#ff3434;font-size:34px;letter-spacing:9px;text-shadow:0 0 18px #f00}.online{color:#70ff8a;margin-top:8px;letter-spacing:3px;font-size:11px}.core-area{height:190px;display:flex;justify-content:center;align-items:center}.core{width:120px;height:120px;border:3px solid #ff3030;border-radius:50%;display:flex;justify-content:center;align-items:center;box-shadow:0 0 25px #ff2020,inset 0 0 25px #ff2020;animation:pulse 1.8s infinite alternate}.core-inner{width:50px;height:50px;border-radius:50%;background:#ff2020;box-shadow:0 0 25px #f00,0 0 50px #f00}@keyframes pulse{from{transform:scale(.95);opacity:.65}to{transform:scale(1.05);opacity:1}}.dashboard,.messages-panel,.input-area,.controls{margin:0 14px 14px}.panel{background:rgba(12,12,12,.94);border:1px solid #641717;border-radius:8px;padding:16px;box-shadow:0 0 15px rgba(255,0,0,.08)}.panel h2{color:#ff4040;letter-spacing:2px;font-size:13px;margin-bottom:14px}#chat{height:245px;overflow-y:auto;line-height:1.55}#chat p{margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}.ultron-name{color:#ff4040}.user-name{color:#aaa}.system-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #242424}.on{color:#5cff79;text-shadow:0 0 8px #00ff44}.off{color:#666}.dashboard{display:grid;grid-template-columns:1fr;gap:14px}.input-area{display:flex;gap:8px}#message,.message-reply input{flex:1;min-width:0;background:#0d0d0d;border:1px solid #641717;color:#fff;padding:13px;border-radius:5px;outline:none}button{background:#151515;color:#ff4545;border:1px solid #731818;padding:11px 14px;border-radius:5px}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.footer{text-align:center;color:#555;font-size:10px;letter-spacing:1px}.thinking{color:#888;font-style:italic}.error{color:#ff6262}#desktopMessages{max-height:180px;overflow-y:auto}.message-meta{color:#ff4040;font-size:11px;margin-bottom:5px}.message-text{margin-bottom:8px}.message-reply{display:flex;gap:6px}.desktop-message{border-bottom:1px solid #242424;padding:9px 0}
</style></head><body>
<header><h1>ULTRON</h1><div class="online">● SYSTEM ONLINE</div></header>
<div class="core-area"><div class="core"><div class="core-inner"></div></div></div>
<div class="dashboard"><div class="panel"><h2>COMMUNICATION LINK</h2><div id="chat"><p><strong class="ultron-name">ULTRON:</strong> Mobile interface initialized. Awaiting instructions.</p></div></div>
<div class="panel"><h2>SYSTEM STATUS</h2><div class="system-row"><span>Discord</span><span class="on">●</span></div><div class="system-row"><span>Ollama</span><span class="on">●</span></div><div class="system-row"><span>Memory</span><span class="on">●</span></div><div class="system-row"><span>Web Intelligence</span><span class="on">●</span></div><div class="system-row"><span>Voice Interface</span><span class="off">○</span></div><div class="system-row"><span>Clap Detection</span><span class="off">○</span></div></div></div>
<div class="panel messages-panel"><h2>MESSAGES</h2><div id="desktopMessages"><p class="thinking">No incoming calls.</p></div></div>
<div class="input-area"><input id="message" placeholder="Message ULTRON..." autocomplete="off"><button id="sendButton" onclick="sendMessage()">SEND</button></div>
<div class="controls"><button>🎙 VOICE</button><button>👏 CLAP</button><button>⚙ STATUS</button><button>🧠 MEMORY</button></div><div class="footer">ULTRON CONTROL INTERFACE // MOBILE SYSTEM</div>
<script>
let waiting=false;
function addMessage(name,text,type=""){const c=document.getElementById("chat"),p=document.createElement("p"),s=document.createElement("strong");s.className=name==="ULTRON"?"ultron-name":"user-name";s.textContent=name+": ";p.appendChild(s);p.appendChild(document.createTextNode(text));if(type)p.classList.add(type);c.appendChild(p);c.scrollTop=c.scrollHeight;return p}
function sendMessage(){const i=document.getElementById("message");const m=i.value.trim();if(!m||waiting)return;addMessage("YOU",m);i.value="";addMessage("ULTRON","Mobile-to-core connection will be enabled in the next build.","thinking")}
document.getElementById("message").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendMessage()}})
</script></body></html>
