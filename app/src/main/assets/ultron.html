<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ULTRON</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{background:radial-gradient(circle at 50% 22%,#270000 0,#090909 34%,#020202 72%);color:#eee;font-family:Arial,sans-serif;overflow:hidden}header{text-align:center;padding:18px 12px 10px}h1{color:#ff3838;font-size:30px;letter-spacing:8px;text-shadow:0 0 18px #f00}.online{color:#6cff82;margin-top:6px;letter-spacing:2px;font-size:10px}.shell{height:calc(100vh - 76px);display:flex;flex-direction:column;padding:0 12px 10px;gap:10px}.core-area{height:112px;display:flex;justify-content:center;align-items:center;flex:0 0 auto}.core{width:82px;height:82px;border:2px solid #ff3030;border-radius:50%;display:flex;justify-content:center;align-items:center;box-shadow:0 0 22px #ff2020,inset 0 0 18px #ff2020;animation:pulse 1.8s infinite alternate}.core-inner{width:34px;height:34px;border-radius:50%;background:#ff2020;box-shadow:0 0 22px #f00,0 0 42px #f00}@keyframes pulse{from{transform:scale(.95);opacity:.65}to{transform:scale(1.04);opacity:1}}.panel{background:rgba(10,10,10,.94);border:1px solid #641717;border-radius:10px;padding:12px;box-shadow:0 0 14px rgba(255,0,0,.08)}.chat-panel{flex:1;min-height:0;display:flex;flex-direction:column}.panel h2{color:#ff4040;letter-spacing:2px;font-size:11px;margin-bottom:9px}#chat{flex:1;min-height:0;overflow-y:auto;line-height:1.45;font-size:14px}#chat p{margin-bottom:10px;white-space:pre-wrap;overflow-wrap:anywhere}.ultron-name{color:#ff4040}.user-name{color:#aaa}.thinking{color:#888;font-style:italic}.error{color:#ff6262}.input-area{display:flex;gap:7px;flex:0 0 auto}#message,.settings input{flex:1;min-width:0;background:#0d0d0d;border:1px solid #641717;color:#fff;padding:12px;border-radius:8px;outline:none;font-size:16px}#message:focus{border-color:#ff3434}button{background:#141414;color:#ff4a4a;border:1px solid #731818;border-radius:9px;font-weight:700}.send{padding:0 15px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:0 0 auto}.quick button{height:52px;font-size:12px;letter-spacing:.5px}.quick button.active{background:#421010;color:#fff;box-shadow:0 0 12px rgba(255,40,40,.35)}.more{display:none;flex:0 0 auto}.more.open{display:block}.settings{display:flex;gap:6px}.settings button{padding:10px}.small{font-size:10px;color:#777;margin-top:7px}.footer{text-align:center;color:#444;font-size:9px;letter-spacing:1px;flex:0 0 auto}
</style></head><body>
<header><h1>ULTRON</h1><div class="online">● SYSTEM ONLINE</div></header>
<main class="shell">
 <div class="core-area"><div class="core"><div class="core-inner"></div></div></div>
 <section class="panel chat-panel"><h2>COMMUNICATION LINK</h2><div id="chat"><p><strong class="ultron-name">ULTRON:</strong> Mobile interface initialized. Awaiting instructions.</p></div></section>
 <div class="input-area"><input id="message" type="text" inputmode="text" enterkeyhint="send" placeholder="Message ULTRON..." autocomplete="off"><button class="send" id="sendButton" type="button" onclick="sendMessage()">SEND</button></div>
 <div class="quick"><button id="voiceButton" onclick="startVoice()">🎙 VOICE</button><button onclick="openCamera()">📷 CAMERA</button><button id="flashButton" onclick="toggleFlashlight()">🔦 OFF</button></div>
 <section id="morePanel" class="panel more"><h2>MORE</h2><div class="settings"><input id="baseUrl" placeholder="PC core address"><input id="token" type="password" placeholder="App token"><button onclick="saveConnection()">SAVE</button></div><div class="small" id="connState">PC settings stay hidden here.</div><div class="settings" style="margin-top:8px"><button id="ttsButton" onclick="toggleTts()">🔊 TTS: ON</button></div></section>
 <button style="height:34px;flex:0 0 auto" onclick="toggleMore()">⋯ MORE</button>
 <div class="footer">ULTRON // MOBILE SYSTEM</div>
</main>
<script>
let waiting=false;
function addMessage(name,text,type=""){const c=document.getElementById("chat"),p=document.createElement("p"),s=document.createElement("strong");s.className=name==="ULTRON"?"ultron-name":"user-name";s.textContent=name+": ";p.appendChild(s);p.appendChild(document.createTextNode(text));if(type)p.classList.add(type);c.appendChild(p);c.scrollTop=c.scrollHeight;return p}
function sendMessage(){const i=document.getElementById("message"),m=i.value.trim();if(!m||waiting)return;addMessage("YOU",m);i.value="";waiting=true;const p=addMessage("ULTRON","Analyzing...","thinking");p.id="thinking";UltronAndroid.sendMessage(m)}
let ttsOn=true;
function receiveUltron(t){document.getElementById("thinking")?.remove();waiting=false;addMessage("ULTRON",t);if(ttsOn)UltronAndroid.speak(t)}
function receiveError(t){document.getElementById("thinking")?.remove();waiting=false;addMessage("ULTRON",t,"error")}
function startVoice(){UltronAndroid.startVoice()}
function openCamera(){UltronAndroid.openCamera()}
function toggleFlashlight(){UltronAndroid.toggleFlashlight()}
function flashlightState(t){const b=document.getElementById("flashButton");b.textContent="🔦 "+t;b.classList.toggle("active",t==="ON")}
function cameraState(t){if(t==="CAMERA UNAVAILABLE")addMessage("ULTRON",t,"error")}
function toggleMore(){document.getElementById("morePanel").classList.toggle("open")}
function voiceState(t){document.getElementById("voiceButton").textContent="🎙 "+t}
function voiceResult(t){document.getElementById("voiceButton").textContent="🎙 VOICE";if(t){document.getElementById("message").value=t;sendMessage()}}
function toggleTts(){ttsOn=!ttsOn;if(!ttsOn){try{UltronAndroid.stopSpeaking()}catch(e){}}document.getElementById("ttsButton").textContent="🔊 TTS: "+(ttsOn?"ON":"OFF")}
function saveConnection(){UltronAndroid.saveConnection(document.getElementById("baseUrl").value,document.getElementById("token").value)}
function connectionState(t){document.getElementById("connState").textContent="Connection settings: "+t}
const messageInput=document.getElementById("message");messageInput.disabled=false;messageInput.readOnly=false;messageInput.addEventListener("click",()=>messageInput.focus());messageInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendMessage()}})
window.addEventListener("load",()=>{try{const saved=UltronAndroid.getBaseUrl();document.getElementById("baseUrl").value=saved;if(saved){document.getElementById("connState").textContent="PC connection saved: "+saved}}catch(e){}});</script></body></html>
